<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GMC Student Schedule Collector</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Palette extracted from user image */
      --red: #9e1b25;
      --blue: #0066ad;
      --green: #254030;
      --white: #ffffff;
      --silver: #b5b7bc;
      --black: #111111;

      --border: 3px solid var(--black);
      --shadow: 6px 6px 0px var(--black);
      --radius: 8px; /* Slightly rounded, but still blocky */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: #f0f0f0; /* Light gray background to pop the cards */
      color: var(--black);
      font-family: 'Archivo', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Enforce single screen */
    }

    /* THE BENTO CONTAINER */
    .bento-grid {
      display: grid;
      grid-template-columns: 300px 1fr; /* Fixed sidebar width, flexible main area */
      grid-template-rows: auto 1fr;
      gap: 20px;
      width: 95vw;
      max-width: 1400px;
      height: 90vh;
      padding: 10px;
    }

    /* GENERIC CARD STYLES */
    .box {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* HEADER (Top Right) */
    .header-box {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      background: var(--red);
      color: var(--white);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    h1 {
      font-weight: 900;
      font-size: 28px;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badge {
      background: var(--black);
      color: var(--white);
      padding: 5px 15px;
      font-weight: 700;
      border-radius: 999px; /* Pill shape */
      font-size: 12px;
    }

    /* PERSONAL INFO (Sidebar - Left) */
    .info-box {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
      background: var(--silver);
    }

    .info-box h2 {
      margin-top: 0;
      font-size: 20px;
      border-bottom: 3px solid var(--black);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .field-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--black);
      background: var(--white);
      font-family: inherit;
      font-weight: 600;
      border-radius: 4px;
      outline: none;
      transition: all 0.1s;
    }
    
    input:focus, select:focus, textarea:focus {
      background: #fff8a0; /* Brutalist highlight color */
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--black);
    }

    /* SCHEDULE AREA (Main Content) */
    .schedule-box {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      display: grid;
      grid-template-columns: 1fr 1fr; /* Split A/B */
      gap: 20px;
      background: transparent;
      box-shadow: none;
      border: none;
      padding: 0;
    }

    .day-column {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .day-header {
      padding: 15px;
      text-align: center;
      font-weight: 900;
      font-size: 20px;
      border-bottom: var(--border);
      text-transform: uppercase;
    }

    .a-header { background: var(--blue); color: white; }
    .b-header { background: var(--green); color: white; }

    .slots-container {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
    }

    .slot-row {
      display: grid;
      grid-template-columns: 40px 1fr;
      align-items: center;
      gap: 10px;
    }

    .slot-num {
      font-weight: 900;
      font-size: 18px;
      text-align: center;
    }

    /* FOOTER / SUBMIT SECTION */
    .submit-area {
      margin-top: auto;
      padding-top: 15px;
    }

    .btn-submit {
      width: 100%;
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 15px;
      font-weight: 800;
      font-size: 16px;
      text-transform: uppercase;
      cursor: pointer;
      border: 2px solid var(--black);
      transition: all 0.2s;
    }

    .btn-submit:hover {
      background: var(--white);
      color: var(--black);
      box-shadow: 4px 4px 0 var(--red);
      transform: translate(-2px, -2px);
    }

    .status-msg {
      font-size: 12px;
      font-weight: 700;
      margin-top: 10px;
      text-align: center;
      min-height: 1.5em;
    }

    .error { color: var(--red); }
    .success { color: var(--green); }

    /* MEDIA QUERY for small screens */
    @media (max-width: 900px) {
      body { height: auto; display: block; overflow: auto; }
      .bento-grid {
        display: block;
        width: 100%;
        height: auto;
      }
      .box, .schedule-box { margin-bottom: 20px; }
      .schedule-box { display: block; }
      .day-column { margin-bottom: 20px; }
    }

  </style>
</head>
<body>

<div class="bento-grid">
  
  <form id="ui-form" class="box info-box" novalidate>
    <h2>Student Info</h2>
    
    <div class="field-group">
      <label>First Name</label>
      <input id="firstName" type="text" placeholder="Jane" required />
    </div>
    
    <div class="field-group">
      <label>Last Name</label>
      <input id="lastName" type="text" placeholder="Doe" required />
    </div>

    <div class="field-group">
      <label>Grade Level</label>
      <select id="studentGrade" required>
        <option value="" disabled selected>-- Select --</option>
      </select>
    </div>

    <div class="field-group">
      <label>Blazer Block</label>
      <select id="blazerBlock" required>
        <option value="" disabled selected>-- Select --</option>
      </select>
    </div>

    <div class="field-group">
      <label>Term</label>
      <select id="term" required>
        <option value="" disabled selected>-- Select --</option>
      </select>
    </div>

    <div class="field-group" style="flex-grow:1; display:flex; flex-direction:column;">
      <label>Notes</label>
      <textarea id="notes" style="flex-grow:1; resize:none;" placeholder="Optional notes..."></textarea>
    </div>

    <div class="submit-area">
      <button id="submitBtn" class="btn-submit">Submit Schedule</button>
      <div id="status" class="status-msg"></div>
    </div>
  </form>

  <div class="box header-box">
    <h1>GMC Schedule Collector</h1>
    <div class="badge">2025-2026</div>
  </div>

  <div class="schedule-box">
    
    <div class="day-column">
      <div class="day-header a-header">A Day</div>
      <div class="slots-container">
        <div class="slot-row">
          <div class="slot-num">1A</div>
          <select id="s1A" required><option value="" disabled selected>Select class...</option></select>
        </div>
        <div class="slot-row">
          <div class="slot-num">2A</div>
          <select id="s2A" required><option value="" disabled selected>Select class...</option></select>
        </div>
        <div class="slot-row">
          <div class="slot-num">3A</div>
          <select id="s3A" required><option value="" disabled selected>Select class...</option></select>
        </div>
        <div class="slot-row">
          <div class="slot-num">4A</div>
          <select id="s4A" required><option value="" disabled selected>Select class...</option></select>
        </div>
      </div>
    </div>

    <div class="day-column">
      <div class="day-header b-header">B Day</div>
      <div class="slots-container">
        <div class="slot-row">
          <div class="slot-num">1B</div>
          <select id="s1B" required><option value="" disabled selected>Select class...</option></select>
        </div>
        <div class="slot-row">
          <div class="slot-num">2B</div>
          <select id="s2B" required><option value="" disabled selected>Select class...</option></select>
        </div>
        <div class="slot-row">
          <div class="slot-num">3B</div>
          <select id="s3B" required><option value="" disabled selected>Select class...</option></select>
        </div>
        <div class="slot-row">
          <div class="slot-num">4B</div>
          <select id="s4B" required><option value="" disabled selected>Select class...</option></select>
        </div>
      </div>
    </div>

  </div>

</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
<form id="googleForm" action="https://docs.google.com/forms/d/e/1FAIpQLSe6Z6zdGlLyLkTgu2aqECkE2ivm45jFSlfln8L-X55Es2uwCQ/formResponse" method="POST" target="hidden_iframe" style="display:none">
  <input name="entry.1765835801" id="g_firstName" />
  <input name="entry.1295172212" id="g_lastName" />
  <input name="entry.1092987940" id="g_studentGrade" />
  <input name="entry.251341019" id="g_blazerBlock" />
  <input name="entry.58541626" id="g_term" />
  <input name="entry.1929321311" id="g_1A" />
  <input name="entry.1709577218" id="g_2A" />
  <input name="entry.1554923251" id="g_3A" />
  <input name="entry.799512969" id="g_4A" />
  <input name="entry.1105828479" id="g_1B" />
  <input name="entry.359857162" id="g_2B" />
  <input name="entry.1260383982" id="g_3B" />
  <input name="entry.185667128" id="g_4B" />
  <input name="entry.1627099109" id="g_notes" />
</form>

<script>
  // CONFIG
  const GRADE_OPTIONS = ["9","10","11","12"];
  const TERM_OPTIONS = ["Fall 2025","Spring 2026"];
  const CLASS_OPTIONS = [
    "Senior Project / Internship", "OPEN", "College - GMC campus (Benson)", "College - Main campus (Barton)",
    "College Seminar", "Ms. Bailey", "Mr. Cook", "Ms. Earle", "Coach Elliott", "Mr. Fitzgerald",
    "Mr. Frans", "Mr. Gallion", "Ms. Gonzalez", "Ms. Grissop", "Ms. Hunter", "Ms. Kirkland",
    "Mr. LaPoe", "Ms. LaPoe", "Mr. Long", "Mr. Lowman", "Mr. MacDonald", "Mr. McCollum",
    "Ms. Meyers", "Ms. Morris", "Coach Owens", "Ms. Oyervides", "Ms. Quinlan", "Mr. Rainey",
    "Ms. Robinson", "Ms. Rouse", "Ms. Sawicki", "Ms. Schonhar", "Ms. Summey", "Ms. Teel",
    "Coach Weaver", "Other"
  ];

  // POPULATE UI
  const fill = (id, list) => {
    const el = document.getElementById(id);
    list.forEach(v => {
      const o = document.createElement('option');
      o.value = o.textContent = v;
      el.appendChild(o);
    });
  };

  fill('studentGrade', GRADE_OPTIONS);
  fill('term', TERM_OPTIONS);
  fill('blazerBlock', CLASS_OPTIONS);
  ['s1A','s2A','s3A','s4A','s1B','s2B','s3B','s4B'].forEach(id => fill(id, CLASS_OPTIONS));

  // LOGIC
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const iframe = document.getElementById('hidden_iframe');
  let waiting = false;

  iframe.onload = () => {
    if(!waiting) return;
    waiting = false;
    statusEl.textContent = 'Submitted successfully! You may close this tab.';
    statusEl.className = 'status-msg success';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Done';
    document.getElementById('ui-form').reset();
  };

  submitBtn.onclick = (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = 'status-msg';

    const req = ['#firstName','#lastName','#studentGrade','#blazerBlock','#term','#s1A','#s2A','#s3A','#s4A','#s1B','#s2B','#s3B','#s4B'];
    for(let r of req) {
      if(!document.querySelector(r).value) {
        statusEl.textContent = 'Missing required fields!';
        statusEl.className = 'status-msg error';
        return;
      }
    }

    // Map values
    document.getElementById('g_firstName').value = document.getElementById('firstName').value;
    document.getElementById('g_lastName').value = document.getElementById('lastName').value;
    document.getElementById('g_studentGrade').value = document.getElementById('studentGrade').value;
    document.getElementById('g_blazerBlock').value = document.getElementById('blazerBlock').value;
    document.getElementById('g_term').value = document.getElementById('term').value;
    document.getElementById('g_1A').value = document.getElementById('s1A').value;
    document.getElementById('g_2A').value = document.getElementById('s2A').value;
    document.getElementById('g_3A').value = document.getElementById('s3A').value;
    document.getElementById('g_4A').value = document.getElementById('s4A').value;
    document.getElementById('g_1B').value = document.getElementById('s1B').value;
    document.getElementById('g_2B').value = document.getElementById('s2B').value;
    document.getElementById('g_3B').value = document.getElementById('s3B').value;
    document.getElementById('g_4B').value = document.getElementById('s4B').value;
    document.getElementById('g_notes').value = document.getElementById('notes').value;

    waiting = true;
    statusEl.textContent = 'Sending...';
    document.getElementById('googleForm').submit();

    setTimeout(() => {
      if(waiting) {
        waiting = false;
        statusEl.textContent = 'Error: No confirmation from Google. Check connection.';
        statusEl.className = 'status-msg error';
      }
    }, 8000);
  };
</script>

</body>
</html>
